<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - SAMU 192</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-samu">
            <!-- Logo Vetorial Oficial SAMU 192 via Wikipédia / Wikimedia -->
            <img src="https://www.gov.br/saude/pt-br/assuntos/balancos/2024/samu-192/imagens/samu-192_logo.png/@@images/image" alt="Logo SAMU 192" class="logo-samu">
            <h4>Acesso ao Sistema</h4>
        </div>
        
        <form id="form-login">
            <div class="campo-grupo">
                <label for="login-email" class="label-campo">E-mail do Servidor</label>
                <input type="email" id="login-email" placeholder="nome@exemplo.com" required autocomplete="email">
            </div>

            <div class="campo-grupo">
                <label for="login-matricula" class="label-campo">Matrícula</label>
                <input type="text" id="login-matricula" placeholder="Digite apenas os números" required inputmode="numeric">
            </div>
            
            <input type="submit" value="Entrar no Sistema" id="btn-login">
            <p id="msg-erro" style="margin-top: 10px; font-weight: bold; font-size: 14px; text-align: center; min-height: 20px;"></p>
        </form>
    </div>

    <script>
        const script_do_google = 'https://script.google.com/macros/s/AKfycbwuf_CRCgEHIQIQoT_KG4zBKR6_tQJbux7TqsbuAaIlwGtLcbCjhTKYNqmhNc0R0x2c/exec';

        const inputEmail = document.getElementById('login-email');
        const inputMatricula = document.getElementById('login-matricula');
        const msgErro = document.getElementById('msg-erro');
        const btnLogin = document.getElementById('btn-login');

        // Remove pontuações da matrícula
        inputMatricula.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });

        // Validação sintática do e-mail
        function validarEmail(email) {
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regexEmail.test(email);
        }

        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();
            
            const email = inputEmail.value.trim().toLowerCase();
            const matricula = inputMatricula.value.trim();

            if (!validarEmail(email)) {
                msgErro.style.color = '#d32f2f';
                msgErro.innerText = 'Por favor, informe um e-mail válido.';
                inputEmail.focus();
                return;
            }

            if (matricula === '') {
                msgErro.style.color = '#d32f2f';
                msgErro.innerText = 'Informe a matrícula apenas com números.';
                inputMatricula.focus();
                return;
            }
            
            btnLogin.disabled = true;
            msgErro.style.color = '#0d47a1';
            msgErro.innerText = 'Validando e-mail e matrícula...';

            fetch(`${script_do_google}?action=login&matricula=${encodeURIComponent(matricula)}&email=${encodeURIComponent(email)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.jaCadastrado === true) {
                        msgErro.style.color = '#d97706';
                        msgErro.innerText = 'Seus dados já foram atualizados.';
                        btnLogin.disabled = false;
                        return;
                    }

                    if (data.auth === true && data.servidor) {
                        msgErro.style.color = '#16a34a';
                        msgErro.innerText = 'Acesso confirmado! Redirecionando...';

                        sessionStorage.setItem('usuario_logado', JSON.stringify({
                            id: data.servidor.id,
                            matricula: data.servidor.matricula,
                            vinc: data.servidor.vinc,
                            nome: data.servidor.nome,
                            email: data.servidor.email
                        }));
                        
                        setTimeout(() => {
                            window.location.href = './cadastro.html';
                        }, 600);

                    } else {
                        msgErro.style.color = '#d32f2f';
                        msgErro.innerText = 'Matrícula ou E-mail não localizados!';
                        btnLogin.disabled = false;
                    }
                })
                .catch(err => {
                    console.error('Erro de conexão:', err);
                    msgErro.style.color = '#d32f2f';
                    msgErro.innerText = 'Erro de conexão com o servidor.';
                    btnLogin.disabled = false;
                });
        });
    </script>
</body>
</html>
